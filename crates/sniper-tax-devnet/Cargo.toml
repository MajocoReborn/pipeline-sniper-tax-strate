[package]
name = "sniper-tax-devnet"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Sets up the sniper-tax program on devnet and runs a demo launch through the Pipeline router"

[dependencies]
base64 = "0.22"
bincode = "1"
borsh = { version = "1.5", features = ["derive"] }
serde_json = "1"
sniper-tax-client = { path = "../sniper-tax-client" }
solana-hash = "4.6"
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
solana-transaction = { version = "=4.3.0", features = ["serde", "wincode"] }
spl-associated-token-account-interface = "2.0.0"
spl-token-2022-interface = "3.1.2"
